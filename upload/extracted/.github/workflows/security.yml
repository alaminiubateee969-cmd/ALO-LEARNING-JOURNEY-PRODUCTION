# ALO Labs AISMH — Security Scanning
# Runs on every push and weekly cron
# Covers: bun audit, dependency scan, Docker image scan (Trivy), CodeQL, gitleaks

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

timeout-minutes: 45

env:
  BUN_VERSION: "1"

jobs:
  # ── Job 1: Bun Audit ─────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit
        id: audit
        run: |
          bun audit 2>&1 | tee audit-results.txt || true

          # Count vulnerabilities
          VULNS=$(grep -c "vulnerability" audit-results.txt 2>/dev/null || echo "0")
          echo "vulns=${VULNS}" >> "$GITHUB_OUTPUT"

          if [ "${VULNS}" -gt 0 ]; then
            echo "::warning::Found ${VULNS} known vulnerabilities in dependencies"
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.txt
          retention-days: 30

      - name: Audit summary
        if: always()
        run: |
          echo "## Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "**Vulnerabilities found:** \`${{ steps.audit.outputs.vulns || 0 }}\`" >> $GITHUB_STEP_SUMMARY

  # ── Job 2: Docker Image Scan (Trivy) ─────────────────────────
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        run: docker build -t aismh-scan:local .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "aismh-scan:local"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          timeout: "10m"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-container

      - name: Trivy table report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "aismh-scan:local"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          timeout: "10m"

  # ── Job 3: CodeQL Analysis ───────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [typescript, javascript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use default queries + security-extended
          queries: security-extended

      # Autobuild handles Next.js / TypeScript projects
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "codeql-${{ matrix.language }}"
          upload: true

  # ── Job 4: Gitleaks — Secret Detection ───────────────────────
  gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Gitleaks summary
        if: always()
        run: |
          echo "## Secret Detection" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.gitleaks.outcome }}" = "success" ]; then
            echo "✅ **No secrets detected**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Secrets detected — review the Gitleaks output**" >> $GITHUB_STEP_SUMMARY
          fi

  # ── Job 5: Consolidated Report ───────────────────────────────
  report:
    name: Security Report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [audit, trivy, codeql, gitleaks]

    steps:
      - name: Consolidated security summary
        run: |
          echo "# 🔒 Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | \`${{ needs.audit.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Container | \`${{ needs.trivy.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL (TS) | \`${{ needs.codeql.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | \`${{ needs.gitleaks.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Triggered by: \`${{ github.actor }}\` on \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail on any critical scan failure
        if: |
          needs.audit.result == 'failure' ||
          needs.gitleaks.result == 'failure'
        run: |
          echo "::error::One or more security scans failed. Check the security report above."
          exit 1