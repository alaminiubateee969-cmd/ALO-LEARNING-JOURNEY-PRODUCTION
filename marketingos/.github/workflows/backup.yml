# ALO Labs AISMH — Automated Database Backup
# Runs daily at 02:00 UTC
# Backs up SQLite DB to remote S3-compatible storage
# Cleans up backups older than 30 days

name: Automated Backup

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Number of days to retain backups"
        required: false
        default: "30"

concurrency:
  group: backup
  cancel-in-progress: false

timeout-minutes: 15

env:
  RETENTION_DAYS: ${{ github.event.inputs.retention_days || '30' }}
  BACKUP_DIR: "/opt/aismh/backups"
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

jobs:
  backup:
    name: Database Backup
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # ── Configure SSH ────────────────────────────────────────
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── Create backup on server ──────────────────────────────
      - name: Create database backup
        id: backup
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="aismh_backup_${TIMESTAMP}.db.gz"

          ssh -i ~/.ssh/deploy_key \
            -p ${{ env.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << BACKUP_SCRIPT
            set -euo pipefail

            BACKUP_DIR="${{ env.BACKUP_DIR }}"
            TIMESTAMP="${TIMESTAMP}"
            BACKUP_FILE="aismh_backup_\${TIMESTAMP}.db.gz"
            DB_PATH="/opt/aismh/db/custom.db"

            # Ensure backup directory exists
            mkdir -p "\${BACKUP_DIR}"

            # Create compressed backup using sqlite3 .backup for consistency
            if [ -f "\${DB_PATH}" ]; then
              # Use sqlite3 online backup API for zero-downtime backup
              TEMP_BACKUP="\${BACKUP_DIR}/\${BACKUP_FILE}.tmp"
              SQLITE_BACKUP="\${BACKUP_DIR}/\${BACKUP_FILE}.db"

              sqlite3 "\${DB_PATH}" ".backup '\${SQLITE_BACKUP}'"
              gzip -c "\${SQLITE_BACKUP}" > "\${TEMP_BACKUP}"
              mv "\${TEMP_BACKUP}" "\${BACKUP_DIR}/\${BACKUP_FILE}"
              rm -f "\${SQLITE_BACKUP}"

              # Verify backup integrity
              gunzip -t "\${BACKUP_DIR}/\${BACKUP_FILE}" && echo "✅ Backup verified"
            else
              echo "❌ Database file not found at \${DB_PATH}"
              exit 1
            fi
          BACKUP_SCRIPT

          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "backup_file=${BACKUP_FILE}" >> "$GITHUB_OUTPUT"

      # ── Upload to S3 / remote storage ────────────────────────
      - name: Upload backup to S3
        if: success()
        run: |
          BACKUP_FILE="${{ steps.backup.outputs.backup_file }}"
          REMOTE_PATH="s3://${{ secrets.S3_BUCKET }}/${{ vars.S3_BACKUP_PREFIX || 'aismh-backups' }}/${BACKUP_FILE}"

          # Download backup locally first, then upload to S3
          scp -i ~/.ssh/deploy_key \
            -P ${{ env.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.BACKUP_DIR }}/${BACKUP_FILE} \
            /tmp/${BACKUP_FILE}

          # Upload using AWS CLI
          aws s3 cp /tmp/${BACKUP_FILE} "${REMOTE_PATH}" \
            --endpoint-url "${{ secrets.S3_ENDPOINT || '' }}" \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}"

          # Cleanup local copy
          rm -f /tmp/${BACKUP_FILE}

          echo "📤 Uploaded ${BACKUP_FILE} to S3"

      # ── Cleanup old backups (keep 30 days) ───────────────────
      - name: Cleanup old local backups
        if: always()
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ env.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << CLEANUP
            set -euo pipefail
            BACKUP_DIR="${{ env.BACKUP_DIR }}"
            RETENTION=${{ env.RETENTION_DAYS }}

            DELETED=$(find "\${BACKUP_DIR}" -name "aismh_backup_*.db.gz" -type f -mtime +\${RETENTION} -print -delete | wc -l)
            echo "🗑️  Cleaned up \${DELETED} backup(s) older than \${RETENTION} days"
          CLEANUP

      - name: Cleanup old S3 backups
        if: always()
        continue-on-error: true
        run: |
          EXPIRY_DATE=$(date -d "${{ env.RETENTION_DAYS }} days ago" +%Y-%m-%d)
          aws s3 rm \
            s3://${{ secrets.S3_BUCKET }}/${{ vars.S3_BACKUP_PREFIX || 'aismh-backups' }}/ \
            --recursive \
            --exclude "*" \
            --include "aismh_backup_*.db.gz" \
            --endpoint-url "${{ secrets.S3_ENDPOINT || '' }}" \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}" 2>/dev/null || true

      # ── Notify on failure ────────────────────────────────────
      - name: Notify on backup failure
        if: failure()
        run: |
          TIMESTAMP="${{ steps.backup.outputs.timestamp || 'unknown' }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -d "{
                \"text\": \"❌ **AISMH Backup FAILED** at \`${TIMESTAMP}\` | <${RUN_URL}|View Run>\"
              }" \
              "${{ secrets.SLACK_WEBHOOK_URL }}" || true
          fi

          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -d "{\"event\":\"backup_failure\",\"timestamp\":\"${TIMESTAMP}\",\"run_url\":\"${RUN_URL}\"}" \
              "${{ secrets.DEPLOY_WEBHOOK_URL }}" || true
          fi

          echo "::error::Database backup failed — check server connectivity and disk space"

      # ── Summary ───────────────────────────────────────────────
      - name: Backup summary
        if: always()
        run: |
          echo "## Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | \`${{ steps.backup.outputs.timestamp || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **File** | \`${{ steps.backup.outputs.backup_file || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Retention** | \`${{ env.RETENTION_DAYS }}\` days |" >> $GITHUB_STEP_SUMMARY