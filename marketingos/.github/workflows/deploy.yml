# ALO Labs AISMH — Production Deployment
# Triggered after successful CI and Docker build on main
# SSH deploy with rolling restart, health checks, and rollback

name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI", "Docker Build & Push"]
    types: [completed]
    branches: [main]

# Only one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

timeout-minutes: 20

env:
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'alo-labs-aismh' }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
  HEALTH_PATH: ${{ vars.HEALTH_PATH || '/api' }}
  HEALTH_TIMEOUT: "60"
  ROLLBACK_IMAGE_FILE: "/tmp/previous-aismh-image.txt"

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    # Only run if both CI and Docker workflows succeeded
    if: >
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}

    steps:
      # ── Resolve image tag ────────────────────────────────────
      - name: Resolve commit SHA for image tag
        id: resolve
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${SHA}" >> "$GITHUB_OUTPUT"

      # ── Configure SSH ────────────────────────────────────────
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── Record current image (for rollback) ─────────────────
      - name: Save current running image tag
        id: save-current
        continue-on-error: true
        run: |
          CURRENT=$(ssh -i ~/.ssh/deploy_key \
            -p ${{ env.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "docker inspect --format='{{index .Config.Image}}' aismh-app 2>/dev/null || echo ''")
          echo "previous_image=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Saving previous image for rollback: ${CURRENT}"

      # ── Pull latest image ────────────────────────────────────
      - name: Pull latest Docker image
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ env.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.short_sha }}"

      # ── Run database migrations ──────────────────────────────
      - name: Run Prisma migrations
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ env.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd /opt/aismh && docker compose run --rm app bunx prisma migrate deploy || true"

      # ── Rolling restart ──────────────────────────────────────
      - name: Rolling restart
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ env.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'DEPLOY_SCRIPT'
            set -euo pipefail

            IMAGE_TAG="${{ steps.resolve.outputs.short_sha }}"
            FULL_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
            COMPOSE_FILE="/opt/aismh/docker-compose.yml"

            echo ">>> Deploying ${FULL_IMAGE} ..."

            # Update the image tag in docker-compose
            cd /opt/aismh
            export AISMH_IMAGE="${FULL_IMAGE}"

            # Rolling restart: start new container, wait for health, stop old
            docker compose up -d --no-deps --build app
            echo ">>> New container started, waiting for health check ..."
            sleep 5
          DEPLOY_SCRIPT

      # ── Health check verification ────────────────────────────
      - name: Verify health check
        id: healthcheck
        run: |
          DEPLOY_URL="${{ vars.DEPLOY_URL || format('http://{0}', env.DEPLOY_HOST) }}"
          HEALTH_URL="${DEPLOY_URL}${{ env.HEALTH_PATH }}"

          echo "Checking ${HEALTH_URL} ..."
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${HEALTH_URL}" || true)
            if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 400 ]; then
              echo "✅ Health check passed (HTTP ${HTTP_CODE}) on attempt ${i}"
              exit 0
            fi
            echo "⏳ Attempt ${i}/12 — HTTP ${HTTP_CODE}, retrying in 5s ..."
            sleep 5
          done

          echo "❌ Health check failed after 60 seconds"
          exit 1
        timeout-minutes: 2

      # ── Cleanup old images ───────────────────────────────────
      - name: Cleanup dangling images
        if: success()
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ env.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "docker image prune -f --filter 'label=com.docker.compose.project=aismh' 2>/dev/null || true"

      # ── Rollback on failure ──────────────────────────────────
      - name: Rollback to previous image
        if: failure()
        run: |
          PREV="${{ steps.save-current.outputs.previous_image }}"
          if [ -z "${PREV}" ]; then
            echo "⚠️ No previous image found, cannot rollback automatically"
            exit 1
          fi

          echo "🔄 Rolling back to ${PREV} ..."
          ssh -i ~/.ssh/deploy_key \
            -p ${{ env.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << ROLLBACK
            set -euo pipefail
            cd /opt/aismh
            export AISMH_IMAGE="${PREV}"
            docker compose up -d --no-deps --build app
            echo ">>> Rollback container started"
          ROLLBACK

      # ── Notify: Slack / Webhook ──────────────────────────────
      - name: Send deployment notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ steps.resolve.outputs.short_sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EMOJI="✅"

          if [ "${STATUS}" != "success" ]; then
            EMOJI="❌"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "text": "${EMOJI} **AISMH Deploy** — ${STATUS^^} | Commit: \`${SHA}\` | <${RUN_URL}|View Run>",
            "attachments": [{
              "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
              "fields": [
                { "title": "Status", "value": "${STATUS}", "short": true },
                { "title": "Commit", "value": "${SHA}", "short": true },
                { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
                { "title": "Branch", "value": "${{ github.event.workflow_run.head_branch || 'main' }}", "short": true }
              ]
            }]
          }
          EOF
          )

          # Slack
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}" || true
          fi

          # Generic webhook (e.g., Discord, custom)
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"${STATUS}\",\"sha\":\"${SHA}\",\"run_url\":\"${RUN_URL}\"}" \
              "${{ secrets.DEPLOY_WEBHOOK_URL }}" || true
          fi

      # ── Summary ───────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ steps.resolve.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Previous** | \`${{ steps.save-current.outputs.previous_image || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY