# ALO Labs AISMH — PR Validation
# Comprehensive PR checks: lint, type-check, build, security audit
# Posts results as PR comment, blocks merge on failure

name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Ignore draft PRs
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

timeout-minutes: 25

env:
  NODE_ENV: production
  BUN_VERSION: "1"

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Use pull_request_target for fork PRs but limit to trusted branches
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork == false)

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # ── Bun Setup ─────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ── Cache ─────────────────────────────────────────────────
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      # ── Install Dependencies ──────────────────────────────────
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Prisma Generate ───────────────────────────────────────
      - name: Generate Prisma Client
        id: prisma
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:./db/custom.db"

      # ── Lint ──────────────────────────────────────────────────
      - name: Run ESLint
        id: lint
        run: |
          LINT_OUTPUT=$(bun run lint 2>&1)
          echo "result=${?}" >> "$GITHUB_OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "${LINT_OUTPUT}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ── Type Check ────────────────────────────────────────────
      - name: TypeScript type check
        id: typecheck
        run: |
          TSC_OUTPUT=$(bunx tsc --noEmit --pretty 2>&1)
          echo "result=${?}" >> "$GITHUB_OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "${TSC_OUTPUT}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ── Build Validation ─────────────────────────────────────
      - name: Next.js production build
        id: build
        run: |
          BUILD_OUTPUT=$(bun run build 2>&1)
          echo "result=${?}" >> "$GITHUB_OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "${BUILD_OUTPUT}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: "file:./db/custom.db"
        timeout-minutes: 10

      # ── Security Audit ────────────────────────────────────────
      - name: Dependency security audit
        id: audit
        run: |
          AUDIT_OUTPUT=$(bun audit 2>&1 || true)
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "${AUDIT_OUTPUT}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Check for high/critical vulnerabilities
          if echo "${AUDIT_OUTPUT}" | grep -qiE "high|critical"; then
            echo "has_vulns=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vulns=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Determine overall result ──────────────────────────────
      - name: Evaluate results
        id: results
        if: always()
        run: |
          OVERALL="✅ PASSED"

          if [ "${{ steps.lint.result }}" = "failure" ]; then
            OVERALL="❌ FAILED"
          fi
          if [ "${{ steps.typecheck.result }}" = "failure" ]; then
            OVERALL="❌ FAILED"
          fi
          if [ "${{ steps.build.result }}" = "failure" ]; then
            OVERALL="❌ FAILED"
          fi
          if [ "${{ steps.audit.outputs.has_vulns }}" = "true" ]; then
            OVERALL="⚠️ PASSED WITH WARNINGS"
          fi

          echo "overall=${OVERALL}" >> "$GITHUB_OUTPUT"

      # ── Comment on PR ─────────────────────────────────────────
      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const lintResult = '${{ steps.lint.result }}' || 'skipped';
            const tscResult = '${{ steps.typecheck.result }}' || 'skipped';
            const buildResult = '${{ steps.build.result }}' || 'skipped';
            const prismaResult = '${{ steps.prisma.result }}' || 'skipped';
            const hasVulns = '${{ steps.audit.outputs.has_vulns }}' === 'true';
            const overall = '${{ steps.results.outputs.overall }}';

            const statusIcon = (r) => {
              if (r === 'success') return '✅';
              if (r === 'failure') return '❌';
              return '⏭️';
            };

            const auditStatus = hasVulns ? '⚠️ Vulnerabilities found' : '✅ No known vulnerabilities';

            const body = `## PR Validation Results — ${overall}

            | Check | Status |
            |-------|--------|
            | ESLint | ${statusIcon(lintResult)} \`${lintResult}\` |
            | TypeScript | ${statusIcon(tscResult)} \`${tscResult}\` |
            | Prisma Generate | ${statusIcon(prismaResult)} \`${prismaResult}\` |
            | Next.js Build | ${statusIcon(buildResult)} \`${buildResult}\` |
            | Security Audit | ${auditStatus} |

            ${hasVulns ? '### ⚠️ Security Warnings\n\n\`\`\`\n' + '${{ steps.audit.outputs.output }}' + '\n\`\`\`\n' : ''}

            > Commit: \`${{ github.event.pull_request.head.sha.substring(0, 7) }}\` | Triggered by: @${{ github.actor }}
            `;

            // Find existing comment from this workflow
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes('PR Validation Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      # ── Block merge on failure ────────────────────────────────
      - name: Fail workflow to block merge
        if: |
          steps.lint.result == 'failure' ||
          steps.typecheck.result == 'failure' ||
          steps.build.result == 'failure'
        run: |
          echo "::error::PR validation failed — ESLint, TypeScript, or Build checks did not pass."
          exit 1