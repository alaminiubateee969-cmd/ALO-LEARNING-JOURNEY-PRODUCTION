name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Validate Prisma schema and generate client
        env:
          DATABASE_URL: mysql://user:placeholder@127.0.0.1:3306/db_learn
        run: |
          bunx prisma validate
          bunx prisma generate

      - name: Build
        env:
          DATABASE_URL: mysql://user:placeholder@127.0.0.1:3306/db_learn
        run: bun run build
