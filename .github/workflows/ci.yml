name: CI

# Verified-PR gate: every pull request into main must pass this workflow.
# The stack is Node 22 + npm (package-lock.json is the canonical lockfile —
# verified VPS uses npm 10.9.9; Bun is not used in CI or production).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma and generate client
        env:
          DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"
        run: |
          npx prisma validate
          npx prisma generate

      - name: Verify the checked-in migration contract
        run: npm run verify:migrations

      - name: Apply migrations twice to isolated MySQL and verify tables/columns
        env:
          DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"
        run: |
          npx prisma migrate deploy
          npx prisma migrate deploy
          npx prisma migrate status
          npm run test:migrations:integration

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and deploy rollback test
        run: |
          npm test
          bash scripts/test-deploy-rollback.sh

      - name: Production build
        env:
          DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"
        run: npm run build
