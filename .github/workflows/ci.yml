name: CI

# Verified-PR gate: every pull request into main must pass this workflow, and
# deploy.yml runs it as its `verify` job (workflow_call) before any production
# step. The toolchain matches production: Node 22 + npm, with package-lock.json
# as the canonical lockfile (scripts/deploy-production.sh and cPanel both run
# `npm ci`). bun.lock is kept for local Bun users only and is not used here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# When deploy.yml calls this workflow it runs in the caller's context, so the
# group must include the workflow name; otherwise the push-triggered CI run and
# deploy's `verify` job would cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Isolated, throwaway CI database only — never a production URL.
      DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma and generate client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Verify the checked-in migration contract
        run: npm run verify:migrations

      - name: Apply migrations twice to isolated MySQL and verify tables/columns
        run: |
          # Print each command's output; on failure also publish its last lines as
          # an error annotation so the database error is visible on the PR itself.
          check() {
            local title="$1"; shift
            local code=0 out
            out=$("$@" 2>&1) || code=$?
            printf '%s\n' "$out"
            if [ "$code" -ne 0 ]; then
              echo "::error title=${title}::$(printf '%s\n' "$out" | grep -v '^[[:space:]]*$' | tail -n 40 | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); gsub(/\r/, "%0D"); print }')"
              exit "$code"
            fi
          }
          check "prisma migrate deploy (first run)" npx prisma migrate deploy
          check "prisma migrate deploy (re-run must be a no-op)" npx prisma migrate deploy
          check "prisma migrate status" npx prisma migrate status
          check "migration integration test" npm run test:migrations:integration

      - name: Schema drift check (migrations must reproduce prisma/schema.prisma)
        run: |
          mysql -h 127.0.0.1 -uroot -pci-root -e "CREATE DATABASE IF NOT EXISTS ci_shadow"
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "mysql://root:ci-root@127.0.0.1:3306/ci_shadow" \
            --script --exit-code > drift.sql 2> drift.err
          code=$?
          set -e
          annotate() { awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); gsub(/\r/, "%0D"); print }' "$1" | head -c 60000; }
          if [ "$code" = "2" ]; then
            cat drift.sql
            echo "::error title=Schema drift::prisma/migrations does not reproduce prisma/schema.prisma. A migration needs:%0A$(annotate drift.sql)"
            exit 1
          fi
          if [ "$code" != "0" ]; then
            cat drift.err drift.sql
            echo "::error title=prisma migrate diff failed::$(cat drift.err drift.sql > drift.all; annotate drift.all)"
            exit "$code"
          fi
          echo "No drift: the migration chain reproduces prisma/schema.prisma exactly."

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and deploy rollback test
        run: |
          npm test
          bash scripts/test-deploy-rollback.sh

      # Built without JWT_SECRET / VAULT_MASTER_KEY on purpose, like the server
      # build in scripts/deploy-production.sh: MarketingOS secrets are runtime-only
      # and must never be able to break an ALO release build.
      - name: Production build
        run: npm run build

      - name: Verify standalone output
        run: test -f .next/standalone/server.js

  security-scan:
    name: Secret scan
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for hardcoded secrets
        run: |
          set -euo pipefail
          # A credential-like key (any case, optionally quoted, e.g. apiKey,
          # OPENAI_API_KEY, "client_secret") assigned a quoted literal with no
          # whitespace: passwords >= 6 chars, other secrets >= 10 chars. Real
          # credentials contain no spaces, so UI labels such as
          # `missing_api_key: "Missing API key"` are not flagged. Excludes
          # dependencies, build output, archived uploads, the separate
          # marketingos/ sub-project, and scripts/ + tests/ fixtures.
          PATTERN="(password|passwd)['\"]?\s*[:=]\s*['\"][^'\"[:space:]]{6,}['\"]|(secret|api[_-]?key|access[_-]?token)['\"]?\s*[:=]\s*['\"][^'\"[:space:]]{10,}['\"]"
          FOUND=$(grep -rEni "${PATTERN}" \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.mjs" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
            --exclude-dir=upload --exclude-dir=marketingos --exclude-dir=mini-services \
            --exclude-dir=examples --exclude-dir=scripts --exclude-dir=tests \
            . || true)
          if [ -n "${FOUND}" ]; then
            echo "::error::Possible hardcoded secrets found:"
            echo "${FOUND}"
            echo ""
            echo "Move these to environment variables before committing."
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Check .env is not tracked
        run: |
          if git ls-files | grep -E "(^|/)\.env$"; then
            echo "::error::.env is tracked in git. Run: git rm --cached .env"
            exit 1
          fi
          echo ".env is not tracked"

      - name: Check database files are not tracked
        run: |
          if git ls-files | grep -iE "\.(db|sqlite|sqlite3)$|\.db-journal$"; then
            echo "::error::A database file is tracked in git. Remove it with git rm --cached."
            exit 1
          fi
          echo "No database files tracked"
