name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true

          script: |
            set -euo pipefail

            export PATH="$HOME/.bun/bin:/usr/local/bin:/usr/bin:$PATH"

            # ================================================================
            # CONFIG
            # ================================================================

            APP_PATH="${VPS_APP_PATH:-/root/alo-github-verify}"
            APP_NAME="alo-learning-journey"
            PORT="${PORT:-3017}"
            HEALTH_URL="http://127.0.0.1:${PORT}/api/health"

            echo "============================================================"
            echo "ALO LEARNING JOURNEY VPS DEPLOY"
            echo "============================================================"
            echo "APP_PATH:   $APP_PATH"
            echo "APP_NAME:   $APP_NAME"
            echo "PORT:       $PORT"
            echo "HEALTH_URL: $HEALTH_URL"
            echo "============================================================"

            # ================================================================
            # 0. VERIFY SERVER ENVIRONMENT
            # ================================================================

            command -v git >/dev/null 2>&1 || {
              echo "FATAL: git is not installed"
              exit 1
            }

            command -v bun >/dev/null 2>&1 || {
              echo "FATAL: bun is not installed"
              exit 1
            }

            command -v pm2 >/dev/null 2>&1 || {
              echo "FATAL: pm2 is not installed"
              exit 1
            }

            if [ ! -d "$APP_PATH/.git" ]; then
              echo "FATAL: $APP_PATH is not a Git working tree."
              echo "Set VPS_APP_PATH to the correct deployment directory."
              exit 1
            fi

            cd "$APP_PATH"

            # ================================================================
            # 1. VERIFY REMOTE
            # ================================================================

            echo ""
            echo ">>> Git remote"

            git remote -v

            # ================================================================
            # 2. VERIFY CLEAN WORKING TREE
            # ================================================================

            echo ""
            echo ">>> Checking working tree"

            if [ -n "$(git status --porcelain)" ]; then
              echo "FATAL: Working tree contains uncommitted changes."
              git status --short
              exit 1
            fi

            # ================================================================
            # 3. SAVE CURRENT VERSION FOR ROLLBACK
            # ================================================================

            PREV_SHA="$(git rev-parse HEAD)"

            echo ""
            echo "CURRENT_SHA=$PREV_SHA"

            mkdir -p .releases
            echo "$PREV_SHA" > .releases/deploy-previous

            # ================================================================
            # 4. BACKUP DATABASE
            # ================================================================

            TS="$(date -u +%Y%m%d-%H%M%S)"

            mkdir -p ".backups/$TS"

            echo ""
            echo ">>> Database backup"

            DB_URL=""

            if [ -f .env ]; then
              DB_URL="$(grep -E '^DATABASE_URL=' .env | head -1 | cut -d= -f2- || true)"
            fi

            case "$DB_URL" in

              file:*)
                DB_FILE="${DB_URL#file:}"

                case "$DB_FILE" in
                  /*)
                    ;;
                  *)
                    DB_FILE="$APP_PATH/$DB_FILE"
                    ;;
                esac

                if [ -f "$DB_FILE" ] && command -v sqlite3 >/dev/null 2>&1; then

                  sqlite3 "$DB_FILE" \
                    ".backup '$APP_PATH/.backups/$TS/db.sqlite'"

                  sqlite3 "$APP_PATH/.backups/$TS/db.sqlite" \
                    "PRAGMA integrity_check;"

                  echo "SQLite backup created."

                else
                  echo "WARN: SQLite database backup unavailable."
                  echo "DB_FILE=$DB_FILE"
                fi
                ;;

              *)
                echo "INFO: Non-SQLite DATABASE_URL."
                echo "Server-side database dump should be handled separately."
                ;;

            esac

            if [ -f .env ]; then
              sha256sum .env > ".backups/$TS/env.sha256"
            fi

            # ================================================================
            # 5. FETCH EXACT GITHUB COMMIT
            # ================================================================

            echo ""
            echo ">>> Fetching origin/main"

            git fetch --prune origin main

            TARGET_SHA="${GITHUB_SHA:-$(git rev-parse origin/main)}"

            echo "TARGET_SHA=$TARGET_SHA"

            git checkout "$TARGET_SHA"

            NEW_SHA="$(git rev-parse HEAD)"

            echo "DEPLOYING_SHA=$NEW_SHA"

            # ================================================================
            # 6. INSTALL DEPENDENCIES
            # ================================================================

            echo ""
            echo ">>> Installing dependencies"

            bun install --frozen-lockfile

            # ================================================================
            # 7. PRISMA GENERATE
            # ================================================================

            echo ""
            echo ">>> Prisma generate"

            bunx prisma generate

            # ================================================================
            # 8. DATABASE SCHEMA
            # ================================================================

            echo ""
            echo ">>> Prisma database push"

            if [ -n "$DB_URL" ]; then

              bunx prisma migrate diff \
                --from-url "$DB_URL" \
                --to-schema-datamodel prisma/schema.prisma \
                --script \
                || echo "WARN: Could not calculate Prisma schema diff."

            else

              echo "WARN: DATABASE_URL not found."

            fi

            bunx prisma db push --skip-generate

            # ================================================================
            # 9. BUILD
            # ================================================================

            echo ""
            echo ">>> Production build"

            bun run build

            # ================================================================
            # 10. HARD BUILD GATE
            # ================================================================

            echo ""
            echo ">>> Checking standalone build"

            if [ ! -f ".next/standalone/server.js" ]; then

              echo "FATAL: .next/standalone/server.js does not exist."

              echo "Build artifact missing."
              echo "Rolling back to $PREV_SHA"

              git checkout "$PREV_SHA"

              bun install --frozen-lockfile
              bunx prisma generate
              bun run build

              pm2 restart "$APP_NAME" --update-env || true

              exit 1

            fi

            echo "Standalone server exists."

            # ================================================================
            # 11. ENSURE PRISMA CLIENT EXISTS IN STANDALONE
            # ================================================================

            echo ""
            echo ">>> Preparing standalone Prisma client"

            mkdir -p \
              ".next/standalone/node_modules/.prisma"

            if [ -d "node_modules/.prisma/client" ]; then

              rm -rf \
                ".next/standalone/node_modules/.prisma/client"

              cp -R \
                "node_modules/.prisma/client" \
                ".next/standalone/node_modules/.prisma/"

            fi

            # ================================================================
            # 12. RESTART APPLICATION
            # ================================================================

            echo ""
            echo ">>> Restarting PM2"

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then

              pm2 restart "$APP_NAME" --update-env

            else

              pm2 start ".next/standalone/server.js" \
                --name "$APP_NAME" \
                --interpreter bun \
                --cwd "$APP_PATH"

            fi

            pm2 save

            # ================================================================
            # 13. WAIT FOR APPLICATION
            # ================================================================

            echo ""
            echo ">>> Waiting for application"

            sleep 8

            # ================================================================
            # 14. HEALTH CHECK
            # ================================================================

            echo ""
            echo ">>> Health check"

            if ! curl \
              --fail \
              --silent \
              --show-error \
              --max-time 20 \
              "$HEALTH_URL"; then

              echo ""
              echo "============================================================"
              echo "FATAL: HEALTH CHECK FAILED"
              echo "============================================================"

              echo "Attempting rollback to:"
              echo "$PREV_SHA"

              # --------------------------------------------------------------
              # Rollback source
              # --------------------------------------------------------------

              git checkout "$PREV_SHA"

              # --------------------------------------------------------------
              # Reinstall/build previous version
              # --------------------------------------------------------------

              bun install --frozen-lockfile

              bunx prisma generate

              bun run build || true

              # --------------------------------------------------------------
              # Restore standalone Prisma client
              # --------------------------------------------------------------

              mkdir -p \
                ".next/standalone/node_modules/.prisma"

              if [ -d "node_modules/.prisma/client" ]; then

                rm -rf \
                  ".next/standalone/node_modules/.prisma/client"

                cp -R \
                  "node_modules/.prisma/client" \
                  ".next/standalone/node_modules/.prisma/"

              fi

              # --------------------------------------------------------------
              # Restart previous version
              # --------------------------------------------------------------

              pm2 restart "$APP_NAME" --update-env || true

              pm2 save || true

              sleep 8

              # --------------------------------------------------------------
              # Verify rollback
              # --------------------------------------------------------------

              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 20 \
                "$HEALTH_URL"; then

                echo ""
                echo "ROLLBACK HEALTH CHECK: OK"
                echo "Restored SHA: $PREV_SHA"

              else

                echo ""
                echo "============================================================"
                echo "CRITICAL: ROLLBACK ALSO FAILED"
                echo "============================================================"
                echo "Manual intervention required."
                echo "Backup directory: $APP_PATH/.backups/$TS"

              fi

              exit 1

            fi

            # ================================================================
            # 15. SUCCESS
            # ================================================================

            echo ""
            echo "============================================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "============================================================"
            echo "SHA:        $NEW_SHA"
            echo "APP:        $APP_NAME"
            echo "PORT:       $PORT"
            echo "HEALTH:     $HEALTH_URL"
            echo "BACKUP:     $APP_PATH/.backups/$TS"
            echo "============================================================"

            echo "$NEW_SHA" > .releases/last-known-good
