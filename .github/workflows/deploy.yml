name: Production deployment (gated)

# The previous push-to-main workflow assumed a machine path, PM2, Bun, and a
# SQLite backup, and applied `prisma db push` without a reviewed migration or a
# MySQL backup. Production deployment stays disabled until the actual host,
# service manager, SSH host key, auth, database migration and rollback plans are
# independently verified. See DEPLOYMENT.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked-until-verified:
    runs-on: ubuntu-latest
    steps:
      - name: Stop before touching production
        run: |
          echo "::error::Deployment is intentionally blocked. Complete the production readiness checks in DEPLOYMENT.md first."
          exit 1
