# ALO Learning Journey — Production Docker Compose
# Usage:
#   1. cp .env.example .env  &&  fill in secrets
#   2. docker compose up -d --build
#   3. docker compose exec app bunx prisma migrate deploy

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alo-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3017:3017"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3017
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/db/custom.db
    volumes:
      - alo-db:/app/db
      - alo-storage:/app/storage
      - ./public/avatars:/app/public/avatars
      - ./public/avatar-videos:/app/public/avatar-videos
      - ./public/avatar-audio:/app/public/avatar-audio
      - ./public/avatar-scenes:/app/public/avatar-scenes
      - ./public/avatar-thumbs:/app/public/avatar-thumbs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3017/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: alo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  alo-db:
  alo-storage:
  caddy-data:
  caddy-config:
